  # ══════════════════════════════════════════════════════════════════════════
  # REVIEW
  # ══════════════════════════════════════════════════════════════════════════
  /reviews:
    post:
      tags: [Review]
      summary: Submit Review
      description: |
        Submits the officer's formal review and recommendation for an application.
        - Inserts into `reviews` table with `submitted_at = NOW()`
        - Updates `applications.status` → `PENDING_VERIFICATION`
        - Logs action in `audit_logs`
        - Triggers notification to Assistant Director (handled by backend)
      operationId: submitReview
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        "201":
          description: Review submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSubmitSuccess'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          description: Review already submitted or application not in review status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Application is not in 'SITE_VISIT_IN_PROGRESS' status."
                code: INVALID_STATUS
        "500":
          $ref: '#/components/responses/ServerError'

  /reviews/{application_id}:
    get:
      tags: [Review]
      summary: Get Review by Application ID
      description: Retrieves the review record for the specified application.
      operationId: getReviewByApplication
      security:
        - BearerAuth: []
      parameters:
        - name: application_id
          in: path
          required: true
          schema:
            type: integer
          example: 101
      responses:
        "200":
          description: Review record retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/ServerError'

  /reviews/{review_id}:
    put:
      tags: [Review]
      summary: Update Review
      description: |
        Updates a submitted review. Only permitted when the application status is
        still `review` (not yet `verified` or `approved`). Returns 403 if locked.
      operationId: updateReview
      security:
        - BearerAuth: []
      parameters:
        - name: review_id
          in: path
          required: true
          schema:
            type: integer
          example: 33
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        "200":
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: "Ulasan dikemaskini."
                review_id: 33
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [Review]
      summary: Delete Review
      description: Soft-deletes a review record. Only allowed before verification.
      operationId: deleteReview
      security:
        - BearerAuth: []
      parameters:
        - name: review_id
          in: path
          required: true
          schema:
            type: integer
          example: 33
      responses:
        "200":
          description: Review deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: "Ulasan dipadam."
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/ServerError'

  # ══════════════════════════════════════════════════════════════════════════
  # OFFLINE SYNC
  # ══════════════════════════════════════════════════════════════════════════
  /sync:
    post:
      tags: [Offline Sync]
      summary: Sync Offline Local Storage Data
      description: |
        Batch uploads records that were saved to the browser's Local Storage
        while the device was offline.

        - Each record is processed sequentially based on its `type` field
        - The same business logic and validation as individual POST endpoints applies
        - Processing does **not** abort on first failure — all records are attempted
        - Per-record success/failure is reported in the response
        - Photo/file data must be base64-encoded within the payload for offline records
      operationId: syncOfflineData
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        "200":
          description: Sync completed (check per-record results for individual failures)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
              examples:
                allSuccess:
                  summary: All records synced successfully
                  value:
                    synced: 2
                    failed: 0
                    results:
                      - local_id: ls_001
                        status: success
                        server_id: 45
                      - local_id: ls_002
                        status: success
                        server_id: 88
                partialFailure:
                  summary: One record failed
                  value:
                    synced: 1
                    failed: 1
                    results:
                      - local_id: ls_001
                        status: success
                        server_id: 45
                      - local_id: ls_002
                        status: failed
                        server_id: null
                        error: "application_id 999 not found."
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/ServerError'